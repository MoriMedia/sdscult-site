<script>
var URL_='https://docs.google.com/forms/d/e/1FAIpQLSc36sBR2913w_otKHXJnZS7oCMNvoyhGPVOQdTc8WO0CwP5hw/formResponse';
var f=document.getElementById('f'),m=document.getElementById('msg'),t0=Date.now();
function done(){f.style.display='none';document.querySelector('.note').style.display='none';m.style.color='#d0d0d0';m.style.fontSize='16px';m.textContent="you're in."}
f.addEventListener('submit',function(e){
e.preventDefault();
var v=f.email.value.trim();
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){m.textContent='enter a valid email';return}
if(f.hp_url.value||Date.now()-t0<1000){done();return}
f.querySelector('button').disabled=true;m.textContent='';
fetch(URL_,{method:'POST',mode:'no-cors',body:new URLSearchParams({'entry.1833472718':v})})
.then(done)
.catch(function(){f.querySelector('button').disabled=false;m.textContent='something went wrong, try again'});
});
</script>
<script>
// fit the smiley exactly onto the real period glyph (period size unchanged)
function fitFace(){
 var h=document.querySelector('h1'),bl=h.querySelector('.bl'),fc=h.querySelector('.face'),t=h.firstChild;
 var cs=getComputedStyle(h),cx=document.createElement('canvas').getContext('2d');
 cx.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
 var m=cx.measureText('.'),hr=h.getBoundingClientRect(),b=bl.getBoundingClientRect().top-hr.top;
 var rg=document.createRange();rg.setStart(t,7);rg.setEnd(t,8);var x0=rg.getBoundingClientRect().left-hr.left;
 var L=-m.actualBoundingBoxLeft,R=m.actualBoundingBoxRight,A=m.actualBoundingBoxAscent,D=m.actualBoundingBoxDescent;
 fc.style.left=(x0+L)+'px';fc.style.top=(b-A)+'px';fc.style.width=(R-L)+'px';fc.style.height=(A+D)+'px';
 var wpx=R-L,dev=wpx*(window.devicePixelRatio||1);
 // too few real pixels to draw a face: show the plain period instead
 fc.style.display=dev<11?'none':'';
 // small dot (phones): slightly bolder eyes and smile
 var bold=wpx<9,e=fc.querySelectorAll('circle'),sm=fc.querySelector('path');
 e[0].setAttribute('r',bold?1.05:.85);e[1].setAttribute('r',bold?1.05:.85);
 sm.setAttribute('stroke-width',bold?1.2:.9);sm.setAttribute('d',bold?'M2.6 5.8 Q5 8.5 7.4 5.8':'M2.7 5.9 Q5 8.3 7.3 5.9');
}
(document.fonts?document.fonts.ready:Promise.resolve()).then(fitFace);window.addEventListener('resize',fitFace);
</script>
